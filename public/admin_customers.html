<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142337"><title>HEX CHEATS SHOP | Customers & Orders</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182638;background:#f3f6f9;--navy:#142337;--blue:#246bce;--line:#e0e7ee;--muted:#708095;--green:#16845f;--red:#bd3b4b}*{box-sizing:border-box}body{margin:0}.top{min-height:66px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,calc((100% - 1180px)/2));gap:12px}.brand{font-weight:850;letter-spacing:.03em;color:white;text-decoration:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.wrap{width:min(1180px,calc(100% - 30px));margin:26px auto 55px}.tabs{display:flex;gap:8px;margin:0 0 18px}.button{border:1px solid transparent;border-radius:9px;padding:9px 13px;background:var(--blue);color:white;font-size:12px;font-weight:750;cursor:pointer;text-decoration:none}.button.secondary{background:white;border-color:var(--line);color:#384a5d}.button.danger{background:var(--red)}.button:disabled{opacity:.55;cursor:wait}.tabs .active{background:var(--navy);color:white}.panel{display:none}.panel.active{display:block}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:15px}.heading h1{margin:3px 0;font-size:25px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:12px}.search{border:1px solid var(--line);border-radius:8px;padding:10px;width:min(290px,100%)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #edf1f5;font-size:12px;vertical-align:top}.table th{background:#f9fbfc;color:#607186;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.pill{display:inline-block;padding:4px 7px;border-radius:99px;background:#eef3f8;font-size:9px;color:#52647a}.pill.ok{background:#e6f5ef;color:var(--green)}.pill.bad{background:#fff0f0;color:var(--red)}.small{font-size:10px;color:var(--muted);margin-top:4px;word-break:break-all}.key{font-family:ui-monospace,monospace;word-break:break-all;max-width:230px}.empty{padding:30px;text-align:center;color:var(--muted)}.status{min-height:20px;color:var(--green);font-size:12px;margin:10px 0}.status.error{color:var(--red)}
@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.wrap{margin-top:18px}.heading{align-items:flex-start;flex-direction:column}.search{width:100%}}
</style></head><body>
<header class="top"><a class="brand" href="/admin/catalog">HEX CHEATS SHOP · ADMIN</a><nav class="actions"><a class="button secondary" href="/admin/catalog">Catalog</a><button class="button secondary" id="logout">Sign out</button></nav></header>
<main class="wrap"><div class="tabs"><button class="button secondary active" data-panel="customers">Customers</button><button class="button secondary" data-panel="orders">Orders</button></div>
<section class="panel active" id="customers"><div class="heading"><div><div class="muted">Website accounts only</div><h1>Customers</h1></div><input class="search" id="search" type="search" placeholder="Search name or email"></div><div class="table-wrap" id="customerTable"><div class="empty">Loading customers…</div></div></section>
<section class="panel" id="orders"><div class="heading"><div><div class="muted">Recent checkouts and deliveries</div><h1>Orders</h1></div><button class="button secondary" id="refreshOrders">Refresh</button></div><div class="table-wrap" id="orderTable"><div class="empty">Loading orders…</div></div></section><div class="status" id="status"></div></main>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('hex_admin_token')||'',searchTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const headers={...(options.headers||{}),'X-Admin-Token':token};const r=await fetch(path,{...options,headers,credentials:'same-origin'});let data={};try{data=await r.json()}catch{}if(r.status===401){localStorage.removeItem('hex_admin_token');location.href='/admin';throw Error('Admin sign-in required.')}if(!r.ok)throw Error(data.error||'Request failed.');return data}
function date(v){return v?new Date(Number(v)*1000).toLocaleString():'—'}
async function loadCustomers(){const q=$('search').value.trim();try{const d=await api('/admin/api/store/accounts'+(q?'?q='+encodeURIComponent(q):''));const a=d.accounts||[];$('customerTable').innerHTML=a.length?`<table class="table"><thead><tr><th>Customer</th><th>Created</th><th>Last login</th><th>Status</th><th>Action</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.display_name||'Customer')}</b><div class="small">${esc(x.email||'')}</div></td><td>${esc(date(x.created_at))}</td><td>${esc(date(x.last_login_at))}</td><td><span class="pill ${x.disabled?'bad':'ok'}">${x.disabled?'Disabled':'Active'}</span></td><td><button class="button ${x.disabled?'secondary':'danger'}" data-account="${Number(x.id)}" data-disabled="${x.disabled?0:1}">${x.disabled?'Enable':'Disable'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No customers found.</div>'}catch(e){$('customerTable').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function loadOrders(){try{const d=await api('/admin/api/store/orders');const a=d.orders||[];$('orderTable').innerHTML=a.length?`<table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Payment</th><th>Delivery key</th><th>Time</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.order_id)}</b><div class="small">${esc(x.transaction_id||'')}</div></td><td>${esc(x.email||'')}</td><td>${esc(x.product_name)}<div class="small">${esc(x.duration)} · ₹${esc(x.amount)}</div></td><td><span class="pill ${x.status==='complete'?'ok':(['failed','paid_delivery_failed','amount_review'].includes(x.status)?'bad':'')}">${esc(x.status)}</span>${x.status==='paid_delivery_failed'?`<div><button class="button" data-retry="${esc(x.order_id)}">Retry delivery</button></div>`:''}</td><td class="key">${esc(x.delivery_key||'—')}</td><td>${esc(date(x.created_at))}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No orders yet.</div>'}catch(e){$('orderTable').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadCustomers,250)});$('refreshOrders').addEventListener('click',loadOrders);$('logout').addEventListener('click',()=>{localStorage.removeItem('hex_admin_token');location.href='/admin'});
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.panel));if(b.dataset.panel==='orders')loadOrders()}));
document.addEventListener('click',async e=>{const b=e.target.closest('[data-account]');const r=e.target.closest('[data-retry]');try{if(b){b.disabled=true;await api(`/admin/api/store/accounts/${b.dataset.account}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({disabled:b.dataset.disabled==='1'})});await loadCustomers()}if(r){r.disabled=true;await api(`/admin/api/store/orders/${encodeURIComponent(r.dataset.retry)}/retry`,{method:'POST'});await loadOrders();$('status').textContent='Delivery retry completed.'}}catch(err){$('status').textContent=err.message;$('status').className='status error'}finally{if(b)b.disabled=false;if(r)r.disabled=false}});
if(!token)location.href='/admin';else{loadCustomers();loadOrders()}
</script></body></html>
